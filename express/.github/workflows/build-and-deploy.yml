name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-image:
    name: Build Docker Image
    runs-on: production
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Copy environment variables
        run: |
          cp ~/config/production/express.env .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: hub.connoisseur-suite.co.uk
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract version, branch, and commit hash
        id: vars
        run: |
          VERSION=$(cat VERSION || echo "v0.0.1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          BRANCH_NAME=${GITHUB_REF_NAME}
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Log variables
        run: |
          echo "Version: $VERSION"
          echo "Short SHA: $SHORT_SHA"
          echo "Branch: $BRANCH_NAME"

      - name: Build and push application image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            hub.connoisseur-suite.co.uk/production/express:${{ env.VERSION }}
            hub.connoisseur-suite.co.uk/production/express:latest


  deploy-image:
    name: Deploy Docker Image
    needs: build-image
    runs-on: production
    steps:

      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: hub.connoisseur-suite.co.uk
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pull the image
        run: |
          docker pull hub.connoisseur-suite.co.uk/production/express:${{ needs.build-image.outputs.version }}

      - name: Update service with new image
        run: |
          docker service update --force --with-registry-auth --image hub.connoisseur-suite.co.uk/production/express:${{ needs.build-image.outputs.version }} express-stack_express
          docker service update --force --with-registry-auth --image hub.connoisseur-suite.co.uk/production/express:${{ needs.build-image.outputs.version }} express-stack_worker